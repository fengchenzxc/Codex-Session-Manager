[package]
name = "codex-session-manager"
version = "0.1.0"
description = "macOS workflow app for Codex sessions, bundles, skills, and sidebar repair"
authors = ["fengchen"]
license = "MIT"
repository = "https://github.com/fengchenzxc/Codex-Session-Manager"
edition = "2021"

[lib]
name = "codex_session_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
